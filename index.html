<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURNAJ</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#101b2b;color:#f6f8ff}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:14px}h1{font-size:25px;margin:12px 0}h2{font-size:20px}button,input,select{font:inherit}button{background:#293e5a;border:1px solid #66809e;color:white;padding:13px 12px;border-radius:13px;font-weight:750;min-height:49px;cursor:pointer}button:disabled{opacity:.35}button:active{transform:scale(.98)}button.green{background:#147f69}button.red{background:#7e3e4c}button.sel{background:#b97d25;border-color:#f9c66e}.panel{background:#1b2b42;border:1px solid #3c536e;border-radius:17px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.nums button{font-size:19px;padding:12px 2px}.muted{color:#aebed2;font-size:14px}.score{padding:11px;border-radius:10px;background:#122036;margin:7px 0;font-size:18px}.active{outline:2px solid #f4c35a}input{width:100%;background:#101b2b;border:1px solid #71829a;border-radius:10px;padding:12px;color:white}#bar{position:sticky;top:0;z-index:3;background:#0c1727;padding:10px 14px;display:flex;gap:14px;overflow:auto;white-space:nowrap;font-size:14px;border-bottom:1px solid #40536d}.wide{width:100%}details{margin:12px 0}summary{padding:10px;cursor:pointer}small{color:#b9c8dc}.tag{border-radius:8px;padding:4px 8px;background:#354967}</style></head><body><div id="bar"></div><main id="app"></main><script>
const G=[['high','High Score',1],['around','Around the Clock',1],['fives','All Fives',1],['x01','X01',2],['obstacles','Překážky',2],['cricket','Cricket',2],['eliminace','Eliminace',2],['vyrazko','Vyřazko',2],['scram','SCRAM Cricket',3],['golf','Golf',3],['shanghai','Shanghai',3],['clobrdo','Člověče, nezlob se',3]];const C=['#e54b56','#448cf1','#f2b84c','#39bd89','#bd83e8','#e48c55','#63d1dd','#e57ba9'];const KEY='turnaj-simple-v1';let S,H=[];function init(){return {page:'home',players:[{name:'SÁJA',color:C[0],points:0},{name:'VOKUREK',color:C[1],points:0}],played:[],game:null,starter:0,champ:null}}try{let x=JSON.parse(localStorage.getItem(KEY));S=x?.s||init();H=x?.h||[]}catch{S=init()}function save(){localStorage.setItem(KEY,JSON.stringify({s:S,h:H.slice(-120)}))}function change(f){H.push(JSON.stringify(S));if(H.length>120)H.shift();f();save();render()}function undo(){if(!H.length)return;S=JSON.parse(H.pop());save();render()}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function b(label,fn,cl='',dis=false){return `<button class="${cl}" ${dis?'disabled':''} onclick="${fn}">${label}</button>`}function gameStart(id){change(()=>{S.page='game';S.game={id,turn:S.starter%S.players.length,darts:[],all:S.players.map(()=>[]),mult:1,round:1,winner:null,notes:'',manual:false}})}function addPlayer(){if(S.players.length>=8)return;change(()=>S.players.push({name:'HRÁČ '+(S.players.length+1),color:C[S.players.length],points:0}))}function delPlayer(i){if(S.players.length<=2)return;change(()=>S.players.splice(i,1))}function setName(i,v){change(()=>S.players[i].name=v)}function home(){return `<div class="panel"><h1>🏆 TURNAJ</h1><p>12 disciplín, jeden vítěz. První hráč s alespoň 10 body vyhrává turnaj.</p>${b('▶ ZAČÍT / POKRAČOVAT',"change(()=>S.page=S.game?'game':'choose')",'green wide')}</div><div class="panel"><h2>Hráči</h2>${S.players.map((p,i)=>`<div class="row" style="margin-bottom:9px"><span style="color:${p.color}">●</span><div style="flex:1"><input value="${esc(p.name)}" onchange="setName(${i},this.value)"></div>${b('✕',`delPlayer(${i})`,'',S.players.length<=2)}</div>`).join('')}${b('＋ Přidat hráče','addPlayer()','',S.players.length>=8)}</div><div class="panel muted">Vše se ukládá automaticky do tohoto prohlížeče. Pro složité disciplíny lze zapisovat zásahy a vítěze potvrdit ručně, aby turnaj šel odehrát i bez chybné automatizace.</div>`}function choose(){let used=S.played.map(x=>G.find(y=>y[0]===x)?.[2]);let available=G.filter(x=>!S.played.includes(x[0])&&(S.played.length>=3||!used.includes(x[2])));return `<div class="panel"><h1>🎯 Vyberte disciplínu</h1><p class="muted">${S.played.length<3?'První tři hry musí být každá z jiné bodové kategorie.':'Vítěz předchozí disciplíny vybírá další.'}</p><div class="grid">${available.map(x=>b(`${x[1]}<br><small>${x[2]} b.</small>`,`gameStart('${x[0]}')`,'green')).join('')}</div></div><div class="panel"><h2>Odehráno</h2>${S.played.length?S.played.map(id=>esc(G.find(x=>x[0]===id)[1])).join(' · '):'Zatím nic'}</div>`}function hit(n){let g=S.game;if(g.winner!==null||g.darts.length>=3)return;let m=g.mult;change(()=>{let val=n===25?25:n===50?50:n*m;let label=n===0?'MIMO':n===25?'BULL 25':n===50?'BULL 50':('SDT'[m-1]+n);let item={n,m,val,label};g.darts.push(item);g.all[g.turn].push(item);g.mult=1})}function next(){let g=S.game;if(g.winner!==null)return;change(()=>{g.darts=[];g.mult=1;g.turn=(g.turn+1)%S.players.length;if(g.turn===S.starter%S.players.length)g.round++})}function pick(i){if(!confirm('Potvrdit vítěze disciplíny: '+S.players[i].name+'?'))return;change(()=>S.game.winner=i)}function award(){let g=S.game;if(g.winner===null)return;change(()=>{let pts=G.find(x=>x[0]===g.id)[2];S.players[g.winner].points+=pts;S.played.push(g.id);S.starter=(S.starter+1)%S.players.length;S.champ=S.players[g.winner].points>=10?g.winner:null;S.game=null;S.page=S.champ===null?'choose':'champ'})}function cancel(){if(!confirm('Opravdu opustit tuto disciplínu bez přidělení bodů?'))return;change(()=>{S.game=null;S.page='choose'})}function reset(){if(confirm('Smazat celý turnaj?')&&confirm('Opravdu? Nelze obnovit jinak než pomocí ZPĚT.'))change(()=>{S=init()})}function viewGame(){let g=S.game,meta=G.find(x=>x[0]===g.id),p=S.players[g.turn],sum=g.darts.reduce((s,x)=>s+x.val,0);return `<div class="panel"><div class="row between"><h2 style="margin:0">${meta[1]}</h2><span class="tag">${meta[2]} body</span></div><p class="muted">Kolo ${g.round} · právě hází <b style="color:${p.color}">${esc(p.name)}</b> · šipka ${Math.min(g.darts.length+1,3)}/3</p></div><div class="panel"><h2>Zápis zásahů</h2><p class="muted">Klepni na Single / Double / Triple a číslo. Po zásahu se automaticky vrací Single. U této rychlé turnajové verze si pravidla jednotlivých disciplín hlídáte sami.</p><div class="grid">${[1,2,3].map(m=>b(['SINGLE','DOUBLE','TRIPLE'][m-1],`change(()=>S.game.mult=${m})`,g.mult===m?'sel':'')).join('')}</div><div class="nums" style="margin-top:10px">${Array.from({length:20},(_,i)=>b(i+1,`hit(${i+1})`,'',g.darts.length>=3||g.winner!==null)).join('')}</div><div class="grid" style="margin-top:9px">${b('MIMO','hit(0)','',(g.darts.length>=3||g.winner!==null))}${b('BULL 25','hit(25)','',(g.darts.length>=3||g.winner!==null))}${b('BULL 50','hit(50)','',(g.darts.length>=3||g.winner!==null))}</div><p><b>Tento tah:</b> ${g.darts.map(x=>x.label).join(' · ')||'—'} <span class="tag">${sum} bodů</span></p><div class="row">${b('↶ ZPĚT','undo()','',(!H.length))}${b('DALŠÍ HRÁČ / TAH →','next()','green',g.winner!==null)}</div></div><div class="panel"><h2>Průběžný zápis disciplíny</h2>${S.players.map((x,i)=>`<div class="score" style="border-left:5px solid ${x.color}"><b>${esc(x.name)}</b> <span class="muted">· ${g.all[i].length} šipek · ${g.all[i].reduce((a,v)=>a+v.val,0)} zapsaných bodů</span><div class="muted">${g.all[i].slice(-9).map(x=>x.label).join(' · ')||'Zatím nic'}</div></div>`).join('')}<p class="muted">Zapsané body jsou jen pomocný součet, nikoliv automatické skóre dané disciplíny.</p></div><div class="panel"><h2>🏁 Výsledek disciplíny</h2><p class="muted">Až dohráte podle pravidel, potvrď vítěze. Turnaj automaticky přidělí správné body a nabídne další disciplínu.</p>${g.winner===null?`<div class="grid">${S.players.map((x,i)=>b('🏆 '+esc(x.name),`pick(${i})`)).join('')}</div>`:`<p>Vítěz: <b>${esc(S.players[g.winner].name)}</b></p>${b('PŘIDĚLIT BODY A POKRAČOVAT','award()','green wide')}${b('↶ Opravit vítěze','undo()')}`}</div><details><summary>⚙️ Další možnosti</summary>${b('Opustit disciplínu','cancel()','red')}${b('Reset celého turnaje','reset()','red')}</details>`}function render(){document.getElementById('bar').innerHTML=S.players.map(p=>`<span style="color:${p.color}">● <b>${esc(p.name)} ${p.points}/10</b></span>`).join('');document.getElementById('app').innerHTML=S.page==='home'?home():S.page==='choose'?choose():S.page==='game'&&S.game?viewGame():`<div class="panel"><h1>🏆 Vítěz turnaje!</h1><h2>${esc(S.players[S.champ]?.name||'')}</h2><p>Gratulujeme!</p>${b('Nový turnaj','reset()','green')}</div>`;if(S.page!=='game'){document.getElementById('app').innerHTML+=`<div class="panel">${b('↶ ZPĚT','undo()','',(!H.length))} ${S.page!=='home'?b('Domů',"change(()=>S.page='home')") :''}</div>`}}render();
</script></body></html>
